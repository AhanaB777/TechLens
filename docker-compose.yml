services:
  analyzer:
    build:
      context: ./Resume-Analyzer
      dockerfile: Dockerfile
    container_name: techlens-analyzer
    command: python main.py
    ports:
      - "8001:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./Resume-Analyzer:/app

  django:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: techlens-django
    volumes:
      - ./server:/app
      - media_files:/app/media
    ports:
      - "8000:8000"
    env_file:
      - path: ./.env
        required: false
      - path: ./.env.local
        required: false
    environment:
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:5173}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      RESUME_ANALYZER_URL: http://analyzer:8000
    depends_on:
      - analyzer

volumes:
  media_files:
